name: ci

# Fast feedback on every push and PR. Everything here must finish in a couple
# of minutes -- the Android build is a separate, slow workflow (android.yml).
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# A new push to the same branch cancels the run it superseded.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # pygame.display and pygame.mixer both need a device. Without these the test
  # process either hangs waiting for a window or dies on ALSA. Set once, for
  # every job and every step.
  SDL_VIDEODRIVER: dummy
  SDL_AUDIODRIVER: dummy
  PYTHONUNBUFFERED: "1"

jobs:
  test:
    name: tests (python ${{ matrix.python-version }})
    # shortcut: setup-python has no 3.9 build for ubuntu-latest (26.04), so this
    # job is pinned; move it back once the 3.9 floor is raised.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is the day-to-day version. 3.9 is the floor the codebase
        # promises ("from __future__ import annotations" everywhere) and is
        # here to catch 3.10+ syntax that would compile fine locally.
        python-version: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dev requirements
        # requirements-dev.txt, not requirements.txt: the art and audio
        # generators in tools/ import numpy and Pillow, and a lint or import
        # pass over them fails without those. They are build-time only and are
        # deliberately absent from the runtime set and from the APK.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Show environment
        run: |
          python -VV
          python -c "import pygame; print('pygame', pygame.version.ver)"
          python -c "import numpy, PIL; print('numpy', numpy.__version__, 'pillow', PIL.__version__)"

      - name: Byte-compile everything
        # Cheap, and on 3.9 it is the whole point of that matrix leg: it fails
        # on match statements, PEP 604 unions outside annotations, and so on.
        run: |
          python -m compileall -q featherdash tools packaging
          test -f main.py && python -m compileall -q main.py || echo "main.py not present yet"

      - name: Validate buildozer.spec
        # Catches a typo'd or duplicated key, a missing 64-bit ABI, a version
        # defined twice, or numpy sneaking into the Android requirements --
        # none of which buildozer itself would complain about.
        run: python packaging/android/validate_spec.py buildozer.spec

      - name: Packaging self-test
        run: python packaging/android/selftest.py

      - name: Run test suite
        # pytest exits 5 when it collects nothing. tests/ may legitimately be
        # empty while the suite is being written, and a red CI for "no tests
        # yet" trains people to ignore red CI.
        run: |
          set +e
          python -m pytest tests -q --color=yes
          # `rc`, not `status`: `status` is a read-only builtin in zsh, and a
          # snippet people copy out of here to run locally should not explode.
          rc=$?
          set -e
          if [ "$rc" -eq 5 ]; then
            echo "::warning::pytest collected no tests in tests/"
            exit 0
          fi
          exit "$rc"

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dev requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Ruff (errors)
        # Blocking, and deliberately narrow: E9 (syntax/IO errors), F63/F7
        # (always-wrong comparisons and statements) and F82 (undefined names).
        # These are bugs, not style.
        run: ruff check --select E9,F63,F7,F82 --exclude .venv,bin,.buildozer .

      - name: Ruff (style)
        # Advisory. Style disagreements should not block a release build, but
        # they should be visible in the log. Rules and excludes come from
        # pyproject.toml, the same set `make lint` enforces.
        continue-on-error: true
        run: ruff check .

      - name: Shell scripts parse
        # bash -n on everything we ship. shellcheck on top where available --
        # it is preinstalled on ubuntu-latest runners.
        run: |
          fail=0
          for f in packaging/android/*.sh; do
            echo "-- $f"
            bash -n "$f" || fail=1
          done
          exit "$fail"

      - name: Shellcheck
        continue-on-error: true
        run: shellcheck -S warning packaging/android/*.sh

      - name: Makefile sanity
        run: |
          make --version | head -1
          make help
          make -n android-debug >/dev/null
